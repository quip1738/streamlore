
name: StreamLore Cloud Video Worker

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "GTA VI livestream or VOD URL"
        required: true
        type: string

jobs:
  inspect-vod:
    name: Inspect and Process GTA VI VOD
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install video tools
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp

      - name: Check FFmpeg
        run: ffmpeg -version

      - name: Inspect VOD
        env:
          VOD_URL: ${{ inputs.video_url }}
        run: |
          yt-dlp --dump-single-json --skip-download "$VOD_URL" > vod.json

          python - <<'PY'
          import json

          with open("vod.json") as f:
              vod = json.load(f)

          print("VOD INSPECTION SUCCESS")
          print("Title:", vod.get("title"))
          print("Duration:", vod.get("duration"), "seconds")
          print("Uploader:", vod.get("uploader"))
          print("Platform:", vod.get("extractor"))
          PY

      - name: Download 60-second sample
        env:
          VOD_URL: ${{ inputs.video_url }}
        run: |
          yt-dlp \
            --download-sections "*0-60" \
            --force-keyframes-at-cuts \
            -f "best[ext=mp4]/best" \
            --merge-output-format mp4 \
            -o "streamlore-test.%(ext)s" \
            "$VOD_URL"

      - name: Render vertical test clip
        run: |
          ffmpeg -y -i streamlore-test.mp4 \
            -vf "crop=trunc(ih*9/16/2)*2:ih,scale=1080:1920" \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -c:a aac \
            -b:a 128k \
            streamlore-vertical-test.mp4

      - name: Upload test videos
        uses: actions/upload-artifact@v4
        with:
          name: streamlore-video-tests
          path: |
            streamlore-test.mp4
            streamlore-vertical-test.mp4
          if-no-files-found: error
          retention-days: 1
