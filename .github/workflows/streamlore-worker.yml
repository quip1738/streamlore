
name: StreamLore Cloud Video Worker

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Twitch, YouTube, or Kick VOD URL"
        required: true
        type: string
      job_id:
        description: "Supabase job ID"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: streamlore-worker
  cancel-in-progress: false

jobs:
  process-vod:
    name: Analyze and Compose GTA VI Clip
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout StreamLore
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp httpx

      - name: Process VOD
        env:
          VOD_URL: ${{ inputs.video_url }}
          JOB_ID: ${{ inputs.job_id }}
          STREAMLORE_API_URL: https://streamlore.prod.page
          STREAMLORE_INTERNAL_TOKEN: ${{ secrets.STREAMLORE_INTERNAL_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python worker/process_vod.py

      - name: Upload generated clip artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: streamlore-clip-${{ inputs.job_id }}
          path: output/streamlore-vertical.mp4
          if-no-files-found: error
          retention-days: 1
